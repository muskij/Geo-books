<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Course — Geo-Books</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#1a1a1a;--rule:#d8d4cc;--paper:#fbfaf7;--accent:#8a3324}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;zoom:1}
a{color:inherit;text-decoration:none}

.masthead{max-width:820px;margin:auto;padding:36px 24px 22px;border-bottom:3px double var(--ink);display:flex;align-items:center;justify-content:space-between;gap:20px}
.masthead-title{font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:normal}
.back-link{font-size:12px;font-style:italic;color:#666}
.back-link:hover{color:var(--ink)}

.course-head{max-width:820px;margin:auto;padding:44px 24px 30px;text-align:center;border-bottom:1px solid var(--rule)}
.course-eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.course-head h1{font-size:clamp(30px,4.5vw,46px);margin:14px 0;font-weight:normal;line-height:1.15}
.course-head p{max-width:540px;margin:0 auto;color:#555;font-size:14px;line-height:1.75;font-style:italic}
.course-stats{margin-top:26px;display:flex;justify-content:center;gap:36px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#777}
.course-stats strong{display:block;font-size:20px;font-family:Georgia,serif;color:var(--ink);letter-spacing:0;text-transform:none}

.toc{max-width:820px;margin:auto;padding:44px 24px}
.toc-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#888;margin-bottom:22px;text-align:center}
.entries{display:flex;flex-direction:column}
.entry{border-top:1px solid var(--rule)}
.entry:last-child{border-bottom:1px solid var(--rule)}
.entry-head{width:100%;background:none;border:0;padding:20px 4px;display:flex;align-items:baseline;gap:18px;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.entry-num{font-size:13px;color:#999;width:28px;flex-shrink:0}
.entry-title{flex:1;font-size:17px}
.entry-status{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#999;flex-shrink:0}
.entry-status.ready{color:var(--accent)}
.entry-body{display:none;padding:0 4px 26px 46px}
.entry-body p{color:#555;font-size:13.5px;line-height:1.8;font-style:italic;margin:0 0 16px}
.res-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.res-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.res-row:disabled{cursor:not-allowed;color:#bbb}
.res-row:not(:disabled):hover{background:#f2efe8}
.res-marker{width:16px;text-align:center;color:var(--accent);font-size:13px}
.res-row:disabled .res-marker{color:#ccc}
.res-label{font-size:13px;flex:1}
.res-sub{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#999}

.empty{padding:70px 20px;text-align:center;color:#888;font-style:italic}

.res-modal-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:#1a1a1acc;padding:20px}
.res-modal-overlay.open{display:flex}
.res-modal{width:min(620px,100%);max-height:85vh;overflow-y:auto;background:var(--paper);border:1px solid var(--ink);padding:36px}
.res-modal-close{float:right;font-size:20px;cursor:pointer;color:#888;line-height:1}
.res-modal-close:hover{color:var(--ink)}
.res-modal h3{margin:0 0 16px;font-size:22px;font-weight:normal;border-bottom:1px solid var(--rule);padding-bottom:12px}
.res-modal p{color:#444;font-size:14px;line-height:1.85;white-space:pre-wrap}
.res-modal audio,.res-modal video{width:100%;margin-top:8px}

.minitext-kicker{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.minitext-kicker-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.minitext-readtime{font-size:11px;font-style:italic;color:#999;white-space:nowrap}
.minitext-heading{font-size:19px;margin:22px 0 8px;font-weight:normal}
.minitext-heading:first-of-type{margin-top:16px}
.minitext-subheading{font-size:15px;margin:18px 0 6px;font-style:italic}
.minitext-paragraph{margin:0 0 12px}
.minitext-pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.minitext-pill{border:1px solid var(--ink);font-size:10px;letter-spacing:.05em;padding:5px 12px}
.minitext-divider{border:0;border-top:1px dashed var(--rule);margin:20px 0}

footer{max-width:820px;margin:auto;padding:30px 24px 50px;text-align:center;color:#999;font-size:11px;font-style:italic;border-top:1px solid var(--rule)}

@media(max-width:560px){.course-stats{gap:20px}.entry-body{padding-left:24px}}
</style>
</head>
<body>

<header class="masthead">
  <span class="masthead-title">Geo-Books University</span>
  <a class="back-link" href="geo-books.htm">← Back to Geo-Books</a>
</header>

<section class="course-head">
  <p class="course-eyebrow" id="courseKicker">Loading course…</p>
  <h1 id="courseTitle">Loading topics…</h1>
  <p id="courseSummary">Fetching your topics for this course.</p>
  <div class="course-stats">
    <div><strong id="statLectureCount">0</strong>Topics</div>
    <div><strong id="statLecturerCount">0</strong>Contributors</div>
    <div><strong id="statRecent">—</strong>Most Recent</div>
  </div>
</section>

<section class="toc">
  <p class="toc-label">Table of Contents</p>
  <div class="entries" id="topicsList">
    <p class="empty">Loading topics…</p>
  </div>
</section>

<div class="res-modal-overlay" id="resModalOverlay">
  <div class="res-modal">
    <span class="res-modal-close" id="resModalClose">✕</span>
    <div id="resModalBody"></div>
  </div>
</div>

<footer>Geo-Books University — part of your University Pass.</footer>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, collection, query, where, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA1nVLSPFs30wG-PLaEyFqm_PEVhZdzISU",
    authDomain: "geo-books-8411e.firebaseapp.com",
    projectId: "geo-books-8411e",
    storageBucket: "geo-books-8411e.firebasestorage.app",
    messagingSenderId: "972887107793",
    appId: "1:972887107793:web:7e0374bf81e6713fd0fdf0",
    measurementId: "G-RY84V5DXPN"
  };
  function getFirebaseApp() { return getApps().length ? getApps()[0] : initializeApp(firebaseConfig); }
  const auth = getAuth(getFirebaseApp());
  const db = getFirestore(getFirebaseApp());

  const API_BASE_URL = window.GEO_BOOKS_API_URL ||
    (location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? 'http://localhost:3007' : '');

  const escapeHTML = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const params = new URLSearchParams(location.search);
  const courseId = params.get('course');

  if (!courseId) {
    document.getElementById('courseTitle').textContent = 'No course selected';
    document.getElementById('courseSummary').textContent = 'Go back and pick a course first.';
  }

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'geo-books.htm'; return; }
    currentUser = user;

    // Same access check as the original course-lectures.htm — this page is
    // reachable directly by URL, so it needs its own independent gate.
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      const sub = snap.exists() ? snap.data().subscription : null;
      const hasAccess = sub && ['UNIVERSITY_PASS_30', 'UNIVERSITY_PASS_70'].includes(sub.tier) && sub.verified === true && sub.status === 'active';
      const isAdmin = (await user.getIdTokenResult()).claims.admin === true;
      if (!hasAccess && !isAdmin) {
        document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:Georgia,serif">
          <div><h2 style="font-weight:normal">University Pass required</h2>
          <p style="color:#666;margin:12px 0 20px;font-style:italic">You need an active University Pass to view course lectures.</p>
          <a href="geo-books.htm" style="border:1px solid #1a1a1a;padding:12px 22px;display:inline-block">Back to Geo-Books</a></div></div>`;
        return;
      }
    } catch (e) {
      console.error('Access check failed:', e);
    }

    if (courseId) loadCourse(courseId);
  });

  async function loadCourse(cid) {
    document.getElementById('courseKicker').textContent = cid;
    document.getElementById('courseTitle').textContent = `${cid}`;

    try {
      const snap = await getDocs(query(collection(db, 'courseTopics'), where('courseId', '==', cid), orderBy('topicNumber', 'asc')));
      const topics = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderTopics(topics, cid);
    } catch (e) {
      console.error('Failed to load topics:', e);
      document.getElementById('topicsList').innerHTML = `<p class="empty">Could not load topics. ${escapeHTML(e.message || '')}</p>`;
    }
  }

  const RESOURCE_DEFS = [
    { key: 'miniText', label: 'Mini-text' },
    { key: 'voiceNote', label: 'Voice note' },
    { key: 'fullLecture', label: 'Full lecture' },
    { key: 'structuredAnswer', label: 'Structured answer' },
    { key: 'quizAssessmentId', label: 'Quiz' }
  ];

  function renderTopics(topics, cid) {
    const readyCount = topics.filter((t) => RESOURCE_DEFS.some((r) => t[r.key])).length;
    document.getElementById('courseSummary').textContent =
      topics.length ? `${topics.length} topic${topics.length === 1 ? '' : 's'} for ${cid}. ${readyCount} ready so far.` : `No topics added for ${cid} yet — check back soon.`;
    document.getElementById('statLectureCount').textContent = topics.length;
    const uploaders = new Set(topics.map((t) => t.createdBy).filter(Boolean));
    document.getElementById('statLecturerCount').textContent = uploaders.size;
    const mostRecent = topics[0]?.createdAt?.toDate ? topics[0].createdAt.toDate().toLocaleDateString() : '—';
    document.getElementById('statRecent').textContent = mostRecent;

    const list = document.getElementById('topicsList');
    if (!topics.length) {
      list.innerHTML = `<p class="empty">Nothing has been added for this course yet.</p>`;
      return;
    }

    list.innerHTML = topics.map((t, i) => {
      const isReady = RESOURCE_DEFS.some((r) => t[r.key]);
      const num = String(t.topicNumber ?? i + 1).padStart(2, '0');
      return `
      <div class="entry" data-topic-id="${t.id}">
        <button class="entry-head" data-toggle="${t.id}">
          <span class="entry-num">${num}</span>
          <span class="entry-title">${escapeHTML(t.title || 'Untitled topic')}</span>
          <span class="entry-status ${isReady ? 'ready' : ''}">${isReady ? 'Ready' : 'Coming soon'}</span>
        </button>
        <div class="entry-body" id="body-${t.id}" style="display:none">
          ${t.description ? `<p>${escapeHTML(t.description)}</p>` : ''}
          <div class="res-list">
            ${RESOURCE_DEFS.map((r) => {
              const has = !!t[r.key];
              return `<button class="res-row" ${has ? `data-resource="${r.key}" data-topic-id="${t.id}"` : 'disabled'}>
                <span class="res-marker">${has ? '§' : '·'}</span>
                <span class="res-label">${r.label}</span>
                <span class="res-sub">${has ? 'Open' : 'Coming soon'}</span>
              </button>`;
            }).join('')}
          </div>
        </div>
      </div>`;
    }).join('');

    list.querySelectorAll('[data-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => toggleEntry(btn.dataset.toggle));
    });
    list.querySelectorAll('[data-resource]').forEach((el) => {
      el.addEventListener('click', () => openResource(el.dataset.resource, el.dataset.topicId, topics));
    });

    const firstReady = topics.find((t) => RESOURCE_DEFS.some((r) => t[r.key]));
    if (firstReady) toggleEntry(firstReady.id, true);
  }

  function toggleEntry(topicId, forceOpen) {
    const body = document.getElementById(`body-${topicId}`);
    const isOpen = body.style.display !== 'none';
    body.style.display = (forceOpen || !isOpen) ? 'block' : 'none';
  }

  function openResource(key, topicId, topics) {
    const topic = topics.find((t) => t.id === topicId);
    if (!topic) return;
    if (key === 'fullLecture') { openLecture(topicId, topic.fullLecture); return; }
    if (key === 'quizAssessmentId') { startTopicQuiz(topic); return; }
    if (key === 'miniText') { showMiniTextResource(topic); return; }
    if (key === 'structuredAnswer') { showResourceModal(`${topic.title} — Structured Answer`, topic.structuredAnswer); return; }
    if (key === 'voiceNote') { showResourceModal(`${topic.title} — Voice Note`, '', `<audio controls src="${escapeHTML(topic.voiceNote)}"></audio>`); return; }
  }

  function showResourceModal(title, text, extraHtml = '') {
    document.getElementById('resModalBody').innerHTML = `<h3>${escapeHTML(title || '')}</h3>${text ? `<p>${escapeHTML(text)}</p>` : ''}${extraHtml}`;
    document.getElementById('resModalOverlay').classList.add('open');
  }

  function estimateReadMinutes(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 200));
  }

  function renderMiniTextBlock(block) {
    switch (block.type) {
      case 'heading': return `<div class="minitext-heading">${escapeHTML(block.text || '')}</div>`;
      case 'subheading': return `<div class="minitext-subheading">${escapeHTML(block.text || '')}</div>`;
      case 'paragraph': return `<p class="minitext-paragraph">${escapeHTML(block.text || '')}</p>`;
      case 'pills': return `<div class="minitext-pills">${(block.items || []).map((i) => `<span class="minitext-pill">${escapeHTML(i)}</span>`).join('')}</div>`;
      case 'divider': return `<hr class="minitext-divider">`;
      default: return '';
    }
  }

  function showMiniTextResource(topic) {
    const readMinutes = topic.miniTextReadMinutes || estimateReadMinutes(topic.miniText || '');
    let html = `
      <div class="minitext-kicker">
        <span class="minitext-kicker-label">${escapeHTML(topic.miniTextKicker || 'Mini-text')}</span>
        <span class="minitext-readtime">${readMinutes} min read</span>
      </div>
      <h3 style="border:0;padding-bottom:0">${escapeHTML(topic.title || '')}</h3>`;

    if (Array.isArray(topic.miniTextBlocks) && topic.miniTextBlocks.length) {
      html += topic.miniTextBlocks.map(renderMiniTextBlock).join('');
    } else if (topic.miniText) {
      html += `<p class="minitext-paragraph">${escapeHTML(topic.miniText)}</p>`;
    }

    document.getElementById('resModalBody').innerHTML = html;
    document.getElementById('resModalOverlay').classList.add('open');
  }
  document.getElementById('resModalClose').addEventListener('click', () => document.getElementById('resModalOverlay').classList.remove('open'));
  document.getElementById('resModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'resModalOverlay') e.currentTarget.classList.remove('open'); });

  // Same cbt.htm session hand-off contract launchCbtSession() in
  // ai-vault-shared.js uses — duplicated here since this standalone page
  // doesn't share that module.
  async function startTopicQuiz(topic) {
    try {
      const snap = await getDoc(doc(db, 'assessments', topic.quizAssessmentId));
      if (!snap.exists()) { alert('This quiz is not available right now.'); return; }
      const a = snap.data();
      sessionStorage.setItem('geoBooksCbtSession', JSON.stringify({
        subject: a.title || topic.title || 'Quiz',
        questions: a.questions || [],
        durationSec: Math.max(600, (a.questions || []).length * 60),
        examType: 'UNIVERSITY_MANUAL',
        startedAtMs: Date.now()
      }));
      window.location.href = 'cbt.htm';
    } catch (e) {
      console.error('startTopicQuiz failed:', e);
      alert('Could not start the quiz. Please try again.');
    }
  }

  // Same monthly-quota-checked open flow as the original course-lectures.htm
  // and the main University SPA section — duplicated here since this is a
  // standalone page.
  async function openLecture(topicId, fileUrl) {
    if (!currentUser || !fileUrl) return;
    try {
      const idToken = await currentUser.getIdToken();
      const res = await fetch(`${API_BASE_URL}/api/lectures/${topicId}/view`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${idToken}` }
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { alert(data.error || 'Could not open this lecture right now.'); return; }
      window.open(fileUrl, '_blank', 'noopener');
    } catch (e) {
      console.error('openLecture failed:', e);
      alert('Could not open this lecture. Check your connection and try again.');
    }
  }
</script>
</body>
</html>
